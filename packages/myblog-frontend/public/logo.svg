<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <rect width="40" height="40" rx="8" fill="#646cff"/>
  <!-- Memo/document icon with lines -->
  <g fill="white">
    <!-- Document outline -->
    <rect x="10" y="8" width="20" height="24" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
    <!-- Lines on the document -->
    <line x1="13" y1="13" x2="27" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="17" x2="25" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="21" x2="23" y2="21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="25" x2="27" y2="25" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
